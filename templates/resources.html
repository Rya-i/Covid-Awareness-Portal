{% extends "base.html" %}
{% block title %}Trusted Resources{% endblock %}
{% block content %}
<section class="wrap section">
  <h1>Trusted resources</h1>
  <p class="lead">Public-health guidance can change. Please consult current official sources.</p>
  <div class="grid">
    {% for name, url, desc in resources %}
    <a class="card link-card" href="{{ url }}" target="_blank" rel="noopener noreferrer"><span class="icon">🔗</span><h2>{{ name }}</h2><p>{{ desc }}</p><small>{{ url }}</small></a>
    {% endfor %}
  </div>
</section>
{% endblock %}
