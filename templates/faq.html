{% extends "base.html" %}
{% block title %}FAQ{% endblock %}
{% block content %}
<section class="wrap section narrow">
  <h1>Frequently asked questions</h1>
  <div class="accordion">
    {% for q, a in faqs %}
    <div class="acc-item">
      <h2><button class="acc-btn" aria-expanded="false" aria-controls="faq{{ loop.index }}">{{ q }}</button></h2>
      <div class="acc-panel" id="faq{{ loop.index }}" hidden><p>{{ a }}</p></div>
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
